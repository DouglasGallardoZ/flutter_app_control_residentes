name: guardin
description: "Una innovadora aplicación Flutter que redefine la seguridad en urbanizaciones, permitiendo a los residentes gestionar accesos con reconocimiento facial y códigos QR, ¡haciendo que entrar a casa sea tan inteligente como seguro!"
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  dio: ^5.5.0
  qr_flutter: ^4.1.0
  share_plus: ^12.0.1
  google_fonts: ^6.3.3
  path_provider: ^2.1.3
  camera: ^0.11.3
  google_mlkit_face_detection: ^0.13.1
  equatable: ^2.0.5
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true
